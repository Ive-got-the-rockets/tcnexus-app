<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Course list views mockup</title><style>html,body{margin:0;min-height:100%;background:#f6f4ee}#mockup{min-height:100vh}</style></head>
<body><div id="mockup"></div><script>
fetch('course-list-views-v18.html').then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');document.title=doc.title;doc.head.querySelectorAll('style').forEach(s=>document.head.appendChild(s.cloneNode(true)));document.getElementById('mockup').innerHTML=doc.body.innerHTML;const style=document.createElement('style');style.textContent=`
    .detail-table .detail-course{align-items:flex-start}
    .detail-table .detail-course>span:not(.thumb){display:block;min-width:0}
    .detail-table .people{margin-top:4px;gap:4px;line-height:1.25}
    .detail-table .people span{display:block;margin:0;padding:0}
  `;document.head.appendChild(style);});
</script></body></html>
