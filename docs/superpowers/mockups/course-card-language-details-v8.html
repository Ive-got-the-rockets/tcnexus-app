<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Backend course card mockup</title>
<style>html,body{margin:0;min-height:100%;background:#f6f4ee}#mockup{min-height:100vh}</style></head>
<body><div id="mockup"></div><script>
fetch('course-card-language-details-v7.html').then(r=>r.text()).then(html=>{
  const doc=new DOMParser().parseFromString(html,'text/html');
  document.title=doc.title;
  document.getElementById('mockup').innerHTML=doc.body.innerHTML;
  const style=document.createElement('style');
  style.textContent=`
    :root{--badge-bg:#f1efe7;--badge-border:#e5e2d9;--badge-text:#7a756c}
    .badge,.badge--type,.badge--lesson,.badge--level{background:var(--badge-bg);border-color:var(--badge-border);color:var(--badge-text);font-weight:400}
    .badge--type,.badge--lesson{color:var(--badge-text);font-weight:400}
    .badge--level{color:var(--badge-text)}
  `;
  document.head.appendChild(style);
});
</script></body></html>
