<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Backend course card mockup</title><style>html,body{margin:0;min-height:100%;background:#f6f4ee}#mockup{min-height:100vh}</style></head>
<body><div id="mockup"></div><script>
fetch('course-card-language-details-v7.html').then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');document.title=doc.title;doc.head.querySelectorAll('style').forEach(s=>document.head.appendChild(s.cloneNode(true)));document.getElementById('mockup').innerHTML=doc.body.innerHTML;const style=document.createElement('style');style.textContent=`
  .title-section{position:relative;padding-right:40px}
  .title-section .status{margin-right:4px}
  .expand-button{position:absolute;right:0;top:14px;width:28px;height:28px;display:grid;place-items:center;border:1px solid #e5e2d9;border-radius:50%;background:#f1efe7;color:#7a756c;cursor:pointer;transition:background .15s ease,color .15s ease,transform .2s ease}
  .expand-button:hover{background:#5fc7a8;color:#12352c}
  .expand-button svg{width:15px;height:15px;transition:transform .2s ease}
  .card:not(.is-expanded) .languages{display:none}
  .card:not(.is-expanded) .actions{margin-top:0}
  .badge-section{padding-right:48px;max-width:100%}
  .level-badges{min-width:0;overflow:hidden}
  .is-expanded .expand-button svg{transform:rotate(180deg)}
  .is-expanded .expand-button{background:#5fc7a8;color:#12352c;border-color:#5fc7a8}
  .badge,.badge--type,.badge--lesson,.badge--level{background:#f1efe7;border-color:#e5e2d9;color:#7a756c;font-weight:400}
`;
document.head.appendChild(style);
document.querySelectorAll('.card').forEach(card=>{const section=card.querySelector('.title-section');const button=document.createElement('button');button.className='expand-button';button.type='button';button.setAttribute('aria-label','Show language details');button.setAttribute('aria-expanded','false');button.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';section.appendChild(button);button.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const expanded=card.classList.toggle('is-expanded');button.setAttribute('aria-expanded',String(expanded));button.setAttribute('aria-label',expanded?'Hide language details':'Show language details')})});
});
</script></body></html>
