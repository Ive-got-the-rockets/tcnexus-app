<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Style-2 Language Selector Mockup</title>
  <style>
    :root{--paper:#0b0e0d;--panel:#181d1a;--ink:#f3f0e8;--muted:#b4b1a9;--signal:#b7ff31;--amber:#e8b84b}
    *{box-sizing:border-box}body{margin:0;background:#030504;color:var(--ink);font-family:Inter,Arial,sans-serif}.stage{min-height:720px;padding:54px 7vw;background:radial-gradient(circle at 80% 20%,#253229 0,#0b0e0d 45%,#030504 85%)}.eyebrow{margin:0 0 12px;color:var(--signal);font:700 11px/1 Inter,Arial;letter-spacing:.16em;text-transform:uppercase}.title{max-width:640px;margin:0;font-size:clamp(42px,5vw,70px);line-height:1.08}.info{display:inline-grid;place-items:center;width:25px;height:25px;margin-left:8px;border:2px solid var(--ink);border-radius:50%;background:transparent;color:var(--ink);font:700 14px Inter;vertical-align:middle}.meta{display:flex;align-items:center;gap:9px;margin-top:28px;font:10px/1 Inter,Arial;letter-spacing:.06em;text-transform:uppercase}.badge{padding:6px 10px;border:1px solid #b9871c;border-radius:999px;color:var(--amber)}.dot{width:6px;height:6px;border-radius:50%;background:var(--signal)}.actions{display:flex;align-items:center;gap:10px;margin-top:22px}.action{height:40px;padding:0 17px;border:1px solid #b8b8b0;border-radius:7px;background:#171b19;color:var(--ink);font:600 13px Inter;cursor:pointer}.play{width:40px;padding:0;border-radius:50%;font-size:18px}.selector{position:relative}.selector button{display:inline-flex;align-items:center;gap:10px}.chevron{font-size:16px;line-height:1}.menu{position:absolute;z-index:4;left:0;top:calc(100% + 8px);min-width:150px;padding:6px;background:#181d1a;border:1px solid #555950;border-radius:8px;box-shadow:0 14px 30px #0008}.menu button{display:block;width:100%;padding:10px;border:0;border-radius:5px;background:transparent;color:var(--ink);text-align:left;font:13px Inter}.menu button:hover,.menu button[aria-selected=true]{background:#2a302c;color:var(--signal)}.hidden{display:none}
    .cards{display:flex;gap:10px;margin-top:70px;overflow:hidden}.card{flex:0 0 260px;height:150px;border-radius:8px;background:linear-gradient(135deg,#203932,#0c1210);box-shadow:0 8px 30px #0007}.card:nth-child(2){background:linear-gradient(135deg,#5c2b27,#141918)}.card:nth-child(3){background:linear-gradient(135deg,#18546b,#121917)}.card:nth-child(4){background:linear-gradient(135deg,#8b6736,#1c211a)}
    .variant{display:none}.variant.is-active{display:block}.variant-name{margin:0 0 20px;color:#8a8f87;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    .v2 .actions{gap:8px}.v2 .selector .action{border-radius:999px;background:transparent}.v2 .selector .menu{border-radius:14px}.v3 .actions{align-items:stretch}.v3 .selector{display:flex}.v3 .selector .action{border-radius:0 7px 7px 0}.v3 .selector:before{content:"LANG";display:flex;align-items:center;padding:0 10px;border:1px solid #b8b8b0;border-right:0;border-radius:7px 0 0 7px;color:var(--muted);font:600 10px Inter;letter-spacing:.08em}
    .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
  </style>
</head>
<body>
  <main id="stage">
    <section class="variant v1 is-active" data-variant="1">
      <div class="stage"><p class="variant-name">Quiet pill selector</p><p class="eyebrow">Featured Course</p><h1 class="title">Trading Around Key<br>Economic Events <button class="info">i</button></h1><div class="meta"><span class="badge">Trading Course</span><span class="dot"></span><span class="badge">4 Lessons</span></div><div class="actions"><button class="action play">▶</button><button class="action">Lessons List</button><button class="action">Course Overview</button><div class="selector"><button class="action language-trigger">Language <span class="chevron">⌄</span></button><div class="menu hidden"><button aria-selected="true">English</button><button>Spanish</button><button>Portuguese</button></div></div></div><div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div></div></div>
    </section>
    <section class="variant v2" data-variant="2">
      <div class="stage"><p class="variant-name">Rounded selector</p><p class="eyebrow">Featured Course</p><h1 class="title">Trading Around Key<br>Economic Events <button class="info">i</button></h1><div class="meta"><span class="badge">Trading Course</span><span class="dot"></span><span class="badge">4 Lessons</span></div><div class="actions"><button class="action play">▶</button><button class="action">Lessons List</button><button class="action">Course Overview</button><div class="selector"><button class="action language-trigger">English <span class="chevron">⌄</span></button><div class="menu hidden"><button aria-selected="true">English</button><button>Spanish</button><button>Portuguese</button></div></div></div><div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div></div></div>
    </section>
    <section class="variant v3" data-variant="3">
      <div class="stage"><p class="variant-name">Labeled selector</p><p class="eyebrow">Featured Course</p><h1 class="title">Trading Around Key<br>Economic Events <button class="info">i</button></h1><div class="meta"><span class="badge">Trading Course</span><span class="dot"></span><span class="badge">4 Lessons</span></div><div class="actions"><button class="action play">▶</button><button class="action">Lessons List</button><button class="action">Course Overview</button><div class="selector"><button class="action language-trigger">English <span class="chevron">⌄</span></button><div class="menu hidden"><button aria-selected="true">English</button><button>Spanish</button><button>Portuguese</button></div></div></div><div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div></div></div>
    </section>
  </main>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Quiet</button>
    <button class="proto-picker-item">Rounded</button>
    <button class="proto-picker-item">Labeled</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const variants=[...document.querySelectorAll('.variant')],picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay');let current=0;
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
    function wireMenus(){document.querySelectorAll('.language-trigger').forEach(trigger=>{trigger.onclick=()=>{const menu=trigger.nextElementSibling;menu.classList.toggle('hidden')};});document.querySelectorAll('.menu button').forEach(option=>{option.onclick=()=>{const menu=option.parentElement,trigger=menu.previousElementSibling;trigger.firstChild.textContent=option.textContent+' ';menu.querySelectorAll('button').forEach(item=>item.setAttribute('aria-selected',item===option?'true':'false'));menu.classList.add('hidden')}})}
    function setActive(i){if(i<0||i>=variants.length)return;current=i;variants.forEach((el,j)=>el.classList.toggle('is-active',j===i));items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);wireMenus()}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay.addEventListener('click',()=>setActive(current));window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')setActive(current)});setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);wireMenus();requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
