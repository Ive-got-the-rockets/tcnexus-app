<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Backend course card mockup</title><style>html,body{margin:0;min-height:100%;background:#f6f4ee}#mockup{min-height:100vh}</style></head>
<body><div id="mockup"></div><script>
fetch('course-card-language-details-v7.html').then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');document.title=doc.title;document.head.querySelectorAll('style').forEach(s=>s.remove());doc.head.querySelectorAll('style').forEach(s=>document.head.appendChild(s.cloneNode(true)));document.getElementById('mockup').innerHTML=doc.body.innerHTML;const style=document.createElement('style');style.textContent='.badge,.badge--type,.badge--lesson,.badge--level{background:#f1efe7;border-color:#e5e2d9;color:#7a756c;font-weight:400}.badge--type,.badge--lesson,.badge--level{color:#7a756c;font-weight:400}';document.head.appendChild(style)});
</script></body></html>
