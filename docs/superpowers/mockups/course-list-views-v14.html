<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Course list views mockup</title><style>html,body{margin:0;min-height:100%;background:#f6f4ee}#mockup{min-height:100vh}</style></head>
<body><div id="mockup"></div><script>
fetch('course-list-views-v13.html').then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');document.title=doc.title;doc.head.querySelectorAll('style').forEach(s=>document.head.appendChild(s.cloneNode(true)));document.getElementById('mockup').innerHTML=doc.body.innerHTML;const compact=document.querySelectorAll('.table')[0];if(!compact)return;compact.querySelectorAll('tr').forEach(row=>{const cells=row.children;if(cells[2])cells[2].remove()});compact.querySelectorAll('.course .thumb').forEach(el=>el.remove());const rows=compact.querySelectorAll('tbody tr');const languageCounts=['2','1','2'];const levelCounts=['3','2','1'];rows.forEach((row,i)=>{const cells=row.children;if(cells[2])cells[2].textContent=languageCounts[i]+' languages';if(cells[3])cells[3].textContent=levelCounts[i]+' levels'});const heading=document.querySelectorAll('.view-label')[0];if(heading)heading.querySelector('span').textContent='Fast scanning · essential course metadata';});
</script></body></html>
