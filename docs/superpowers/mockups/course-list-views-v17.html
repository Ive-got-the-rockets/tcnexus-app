<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Course list views mockup</title><style>html,body{margin:0;min-height:100%;background:#f6f4ee}#mockup{min-height:100vh}</style></head>
<body><div id="mockup"></div><script>
fetch('course-list-views-v13.html').then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');document.title=doc.title;doc.head.querySelectorAll('style').forEach(s=>document.head.appendChild(s.cloneNode(true)));document.getElementById('mockup').innerHTML=doc.body.innerHTML;const style=document.createElement('style');style.textContent=`
    .detail-table .detail-course small{display:none}
    .detail-table .detail-course{align-items:flex-start}
    .detail-table .people{display:grid;gap:4px;margin-top:7px;color:#7a756c;font-size:10px;line-height:1.3}
    .detail-table .people strong{display:block;color:#201f1c;font:400 16px/1.12 Fraunces,'Iowan Old Style',Georgia,serif}
    .detail-table .language-block{display:grid;gap:8px;min-width:280px}
    .detail-table .language-group{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start;padding:8px 10px;border-radius:7px;background:#f1efe7}
    .detail-table .language-name-detail{font-size:11px;font-weight:700}
    .detail-table .level-column{display:grid;gap:5px}
    .detail-table .level-detail{display:flex;justify-content:space-between;gap:12px;color:#7a756c;font-size:10px}
    .detail-table .level-detail strong{color:#201f1c;font-weight:400}
    .detail-table .level-detail em{color:#b98327;font-style:normal;white-space:nowrap}
  `;document.head.appendChild(style);
  const tables=document.querySelectorAll('.table');const compact=tables[0];if(compact){compact.querySelectorAll('tr').forEach(row=>{const cells=row.children;if(cells[2])cells[2].remove()});compact.querySelectorAll('.course .thumb').forEach(el=>el.remove());const rows=compact.querySelectorAll('tbody tr');['2','1','2'].forEach((count,i)=>{if(rows[i]&&rows[i].children[2])rows[i].children[2].textContent=count+' languages'});['3','2','1'].forEach((count,i)=>{if(rows[i]&&rows[i].children[3])rows[i].children[3].textContent=count+' levels'});const heading=document.querySelectorAll('.view-label')[0];if(heading)heading.querySelector('span').textContent='Fast scanning · essential course metadata'}
  const detail=tables[1];if(detail){const header=detail.querySelectorAll('thead th')[2];if(header)header.textContent='Language & Level Breakdown';const people=[['Coco Blanco','Ana Torres, Marco Diaz'],['Lena Ortiz','—'],['Daniel Ruiz','Sofia Kim']];detail.querySelectorAll('tbody tr').forEach((row,index)=>{const course=row.querySelector('.detail-course');const small=course?.querySelector('small');if(small)small.remove();if(course){const info=document.createElement('div');info.className='people';info.innerHTML='<span><strong>Instructor:</strong> '+people[index][0]+'</span><span><strong>Guest:</strong> '+people[index][1]+'</span>';course.appendChild(info)}row.querySelectorAll('.language-row').forEach(oldRow=>{const language=oldRow.querySelector('b')?.textContent.trim()||'';const levels=[...oldRow.querySelectorAll('.level')].map(el=>el.textContent.trim());const counts=(oldRow.querySelector('.lesson-count')?.textContent||'').split('/').map(v=>v.trim());const group=document.createElement('div');group.className='language-group';const name=document.createElement('div');name.className='language-name-detail';name.textContent=language;const column=document.createElement('div');column.className='level-column';levels.forEach((level,i)=>{const line=document.createElement('div');line.className='level-detail';line.innerHTML='<strong>'+level+'</strong><em>'+(counts[i]||'0')+' lessons</em>';column.appendChild(line)});group.append(name,column);oldRow.replaceWith(group)})})}
});
</script></body></html>
