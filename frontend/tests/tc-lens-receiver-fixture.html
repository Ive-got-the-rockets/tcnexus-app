<!doctype html>
<meta charset="utf-8">
<title>TC Lens receiver fixture</title>
<style>
body { margin:0; padding:24px; background:#101313; color:#e8eeee; font:14px/1.45 system-ui,sans-serif; }
pre { padding:16px; background:#050707; white-space:pre-wrap; }
</style>
<h1>TC Lens guide receiver fixture</h1>
<p id="status">Waiting for a prompt...</p>
<pre id="log"></pre>
<script>
  const status = document.querySelector('#status');
  const log = document.querySelector('#log');
  let busy = false;
  const hostOrigin = location.origin;
  window.addEventListener('message', (event) => {
    if (event.source !== parent || event.origin !== hostOrigin) return;
    const message = event.data;
    if (message?.type !== 'tc-lens-time-update' || typeof message.message !== 'string' ||
        !message.message.trim() || ![undefined, 'ask', 'operate'].includes(message.workflow)) return;
    const reply = (state, reason) => event.source.postMessage({
      type: 'tc-lens-ack', videoId: message.videoId, chapter: message.chapter, state,
      ...(reason ? { reason } : {}),
    }, event.origin);
    log.textContent += JSON.stringify(message, null, 2) + '\n\n';
    if (busy) { reply('error', 'busy'); return; }
    busy = true;
    status.textContent = 'Running prompt for video ' + message.videoId;
    reply('running');
    setTimeout(() => {
      busy = false;
      status.textContent = 'Finished';
      reply('finished');
    }, 250);
  });
</script>
