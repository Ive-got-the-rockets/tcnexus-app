<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TC Nexus pricing popup mockup</title><style>html,body{margin:0;width:100%;height:100%;background:#101719}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="preview" src="pricing-popup-mockup-v3.html" title="Pricing popup mockup"></iframe><script>preview.addEventListener('load',()=>{const nested=preview.contentDocument.querySelector('iframe');if(!nested)return;nested.addEventListener('load',()=>{const d=nested.contentDocument;const applyStagger=()=>setTimeout(()=>d.querySelectorAll('.price .digit-strip').forEach((strip,index)=>strip.style.transitionDelay=(index%2?'0.5s':'0s')),0);d.querySelectorAll('.toggle button').forEach(button=>button.addEventListener('click',applyStagger,true));applyStagger()})});</script></body></html>
