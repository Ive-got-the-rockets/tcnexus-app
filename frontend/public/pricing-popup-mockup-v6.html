<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TC Nexus pricing popup mockup</title><style>html,body{margin:0;width:100%;height:100%;background:#101719}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="preview" src="pricing-popup-mockup-v2.html" title="Pricing popup mockup"></iframe><script>preview.addEventListener('load',()=>{const d=preview.contentDocument,style=d.createElement('style');style.textContent='.digit-window{display:inline-block;height:1em;overflow:hidden;vertical-align:bottom}.digit-strip{display:flex;flex-direction:column;transition:transform .72s cubic-bezier(.65,0,.35,1)}.digit-strip span{display:block;height:1em;line-height:1em}.price.rolling .digit-strip{transform:translateY(-50%)}';d.head.appendChild(style);const prices=[...d.querySelectorAll('.price')],monthly=['15','29','79'],annual=['12','23','63'],buttons=[...d.querySelectorAll('.toggle button')];function render(v){buttons.forEach((b,i)=>b.classList.toggle('active',i===v));prices.forEach((p,i)=>{const old=(v?monthly:annual)[i],next=(v?annual:monthly)[i];p.innerHTML='<span>$</span>'+next.split('').map((n,j)=>'<span class="digit-window"><span class="digit-strip" style="transition-delay:'+(j?'0.5s':'0s')+'"><span>'+old[j]+'</span><span>'+n+'</span></span></span>').join('')+'<small> / '+(v?'year':'month')+'</small>';p.classList.remove('rolling');void p.offsetWidth;p.classList.add('rolling')})}buttons[0].onclick=()=>render(0);buttons[1].onclick=()=>render(1);render(0)});</script></body></html>
