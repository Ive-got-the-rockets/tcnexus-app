<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TC Lens frame</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 18px; background: #101613; color: #eef3ee; font: 13px/1.4 Inter, "Segoe UI", sans-serif; }
    .ready { display: inline-flex; align-items: center; gap: 7px; color: #c6ff3f; font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .ready::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 12px currentColor; }
    h2 { margin: 13px 0 4px; font-size: 22px; letter-spacing: -.04em; }
    p { margin: 0 0 18px; color: #8e9a94; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
    .metric { min-height: 84px; padding: 12px; border: 1px solid #334039; border-radius: 8px; background: #151d19; }
    .metric span { display: block; color: #87938d; font-size: 10px; text-transform: uppercase; }
    .metric strong { display: block; margin-top: 7px; font-size: 19px; }
    .positive { color: #c6ff3f; }
    .chart { height: 150px; margin-top: 10px; border: 1px solid #334039; border-radius: 8px; background: linear-gradient(155deg, transparent 49%, #c6ff3f 50%, transparent 51%), #151d19; }
  </style>
</head>
<body>
  <span class="ready">Iframe ready</span>
  <h2>Trade intelligence</h2>
  <p>This content appeared only after the panel completed most of its entrance.</p>
  <div class="grid"><div class="metric"><span>Implied volatility</span><strong>31.8%</strong></div><div class="metric"><span>Momentum</span><strong class="positive">Bullish</strong></div></div>
  <div class="chart" aria-label="Sample market chart"></div>
</body>
</html>
