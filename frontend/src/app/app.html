@if (!chromeHidden()) {
  <header class="site-header" [class.site-header--hidden]="headerHidden()">
    <a class="wordmark" routerLink="/">
      TC <span>Nexus</span>
    </a>

    <nav class="site-header__nav">
      <span>Trading Courses</span>
      <span>Platform Courses</span>
      <span>Store</span>
    </nav>

    <div class="site-header__actions">
      <button type="button" class="site-header__icon" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="8.3" width="14" height="12" rx="2.2"></rect>
          <path d="M9 8.3a3 3 0 0 1 6 0"></path>
        </svg>
      </button>
      <button type="button" class="site-header__icon" aria-label="Profile" (click)="authModal.open()">
        <svg viewBox="0 0 24 24" fill="none" stroke-linejoin="round">
          <path d="M12 2.2 20.5 7v10L12 21.8 3.5 17V7z" style="stroke: var(--signal);" stroke-width="1.6"></path>
          <circle cx="12" cy="9.6" r="2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></circle>
          <path d="M7 17.6c0-2.8 2.4-4.4 5-4.4s5 1.6 5 4.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
        </svg>
      </button>
    </div>
  </header>
}

<router-outlet />

@if (!chromeHidden()) {
  <footer class="site-footer">
    <a class="wordmark" routerLink="/">
      TC <span>Nexus</span>
    </a>

    <div class="footer__right">
      <div class="footer__menu">
        <span>Trading Courses</span>
        <span class="footer__divider">|</span>
        <span>Platform Courses</span>
        <span class="footer__divider">|</span>
        <span>Merch Store</span>
      </div>
      <p class="footer__copyright">&copy; {{ year }} Trade Cheetah Nexus - All rights reserved.</p>
    </div>
  </footer>
}

<app-register-modal />
